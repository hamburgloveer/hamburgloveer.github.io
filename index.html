<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DONT</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DONT">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #fff;
    color: #000;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100dvh;
  }

  /* 封面：黑底白圈 */
  #cover {
    position: fixed; inset: 0; z-index: 10;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .35s ease;
  }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover .ring { width: min(46vw, 210px); aspect-ratio: 1; border: 2px solid #fff; border-radius: 50%; }
  #cover .name { color: #fff; margin-top: 40px; font-size: 22px; letter-spacing: .55em; text-indent: .55em; font-weight: 500; }
  #cover .hint { color: #555; margin-top: 20px; font-size: 12px; letter-spacing: .3em; text-indent: .3em; }

  /* 主界面：固定一屏，不可上下滑动 */
  .app {
    height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px calc(env(safe-area-inset-bottom, 0px) + 22px);
  }
  .date { font-size: 15px; letter-spacing: .18em; }
  .date .wd { color: #999; margin-left: 8px; }
  .btn-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #checkBtn {
    width: min(74vw, 330px); aspect-ratio: 1; border-radius: 50%;
    border: 2px solid #000; background: #fff; color: #000;
    font-size: 30px; letter-spacing: .25em; text-indent: .25em;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, color .2s ease;
  }
  #checkBtn:active { transform: scale(.97); }
  #checkBtn.done { background: #000; color: #fff; }
  #checkBtn .tick { display: block; font-size: 58px; line-height: 1.1; }
  #checkBtn .sub { display: block; font-size: 12px; letter-spacing: .2em; text-indent: .2em; margin-top: 10px; color: #777; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bottom .nav a { color: #000; font-size: 14px; letter-spacing: .25em; text-decoration: none; }
  .bottom .sync { color: #bbb; font-size: 11px; letter-spacing: .08em; }
</style>
</head>
<body>
  <div id="cover">
    <div class="ring"></div>
    <div class="name">DONT</div>
    <div class="hint">轻点进入</div>
  </div>

  <div class="app">
    <div class="date"><span id="dateLabel"></span><span class="wd" id="wdLabel"></span></div>
    <div class="btn-wrap">
      <button id="checkBtn">打卡</button>
    </div>
    <div class="bottom">
      <div class="nav"><a href="calendar.html">日历 →</a></div>
      <div class="sync" id="syncLabel"></div>
    </div>
  </div>

<script>
  const KEY = 'dont-days';
  const OLD_KEY = 'daka-days';
  // GitHub 同步中转地址：部署 Worker 后填入，例如 https://daka-sync.xxx.workers.dev
  // 为空时记录只存在本机浏览器里；填入后自动与仓库里的 data.json 同步。
  const WORKER_URL = "";

  // 一次性迁移旧版记录
  try {
    if (!localStorage.getItem(KEY) && localStorage.getItem(OLD_KEY)) {
      localStorage.setItem(KEY, localStorage.getItem(OLD_KEY));
    }
  } catch (e) {}

  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const save = (s) => localStorage.setItem(KEY, JSON.stringify([...s]));
  let days = load();

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = new Date();
  const todayStr = fmt(today);
  const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  const btn = document.getElementById('checkBtn');
  const syncLabel = document.getElementById('syncLabel');
  document.getElementById('dateLabel').textContent =
    today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';
  document.getElementById('wdLabel').textContent = WEEKDAYS[today.getDay()];

  function setSync(t) { syncLabel.textContent = t; }
  if (!WORKER_URL) setSync('本机记录 · 未接 GitHub');

  function render() {
    const done = days.has(todayStr);
    btn.innerHTML = done ? '<span class="tick">✓</span><span class="sub">再点一次取消</span>' : '打卡';
    btn.className = done ? 'done' : '';
    btn.id = 'checkBtn';
  }

  async function pushRemote() {
    if (!WORKER_URL) return;
    try {
      const r = await fetch(WORKER_URL + '/api/days', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days: [...days] })
      });
      if (r.ok) setSync('已同步 GitHub');
    } catch (e) { setSync('同步失败 · 仅本机'); }
  }

  async function syncFromRemote() {
    if (!WORKER_URL) return;
    try {
      const r = await fetch(WORKER_URL + '/api/days');
      if (!r.ok) return;
      const data = await r.json();
      const remote = new Set(Array.isArray(data.days) ? data.days : []);
      let changed = false;
      remote.forEach((d) => { if (!days.has(d)) { days.add(d); changed = true; } });
      if (changed) { save(days); render(); }
      setSync('已同步 GitHub');
      await pushRemote();
    } catch (e) { setSync('同步失败 · 仅本机'); }
  }

  btn.addEventListener('click', () => {
    if (days.has(todayStr)) days.delete(todayStr); else days.add(todayStr);
    save(days);
    render();
    pushRemote();
  });

  document.getElementById('cover').addEventListener('click', function () {
    this.classList.add('hide');
    setTimeout(() => { this.style.display = 'none'; }, 400);
  });

  render();
  syncFromRemote();
</script>
</body>
</html>
