<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DONT</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DONT">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="apple-touch-startup-image.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; }
  body {
    background-color: #000;
    background-image: radial-gradient(120% 90% at 50% 38%, #111116 0%, #000 62%);
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100dvh;
  }

  /* 星空底：细碎星点，少许微闪 */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #stars i { position: absolute; border-radius: 50%; background: #fff; display: block; }
  @keyframes tw { from { opacity: .15; } to { opacity: .85; } }

  /* 主界面：固定一屏，不可上下滑动 */
  .app {
    position: relative; z-index: 1;
    height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px calc(env(safe-area-inset-bottom, 0px) + 22px);
  }
  .date { font-size: 15px; letter-spacing: .18em; color: #fff; }
  .date .wd { color: #888; margin-left: 8px; }
  .streak { margin-top: 14px; min-height: 20px; font-size: 14px; letter-spacing: .2em; color: #bbb; }
  .btn-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #checkBtn {
    width: min(74vw, 330px); aspect-ratio: 1; border-radius: 50%;
    border: 2px solid #fff; background: #fff; color: #000;
    font-size: 30px; letter-spacing: .25em; text-indent: .25em;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(255,255,255,.28), 0 0 140px rgba(255,255,255,.10);
    transition: transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  #checkBtn:active { transform: scale(.97); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.05); } 100% { transform: scale(1); } }
  #checkBtn.pop { animation: pop .35s ease; }
  /* 已打卡：月食——黑底白圈 */
  #checkBtn.done { background: #000; color: #fff; box-shadow: 0 0 44px rgba(255,255,255,.16); }
  #checkBtn .tick { display: block; font-size: 58px; line-height: 1.1; }
  #checkBtn .sub { display: block; font-size: 12px; letter-spacing: .2em; text-indent: .2em; margin-top: 10px; color: #999; }
  #checkBtn.done .sub { color: #999; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bottom .nav a { color: #fff; font-size: 14px; letter-spacing: .25em; text-decoration: none; }
  .bottom .sync { color: #666; font-size: 11px; letter-spacing: .08em; cursor: pointer; }

  /* 连接设置：一次性粘贴 token，存在本机 */
  #setup {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0,0,0,.92);
    align-items: center; justify-content: center; padding: 28px;
  }
  #setup.open { display: flex; }
  #setup .card { width: 100%; max-width: 380px; text-align: center; }
  #setup h2 { font-size: 18px; letter-spacing: .3em; text-indent: .3em; font-weight: 500; margin-bottom: 16px; }
  #setup p { color: #999; font-size: 13px; line-height: 1.9; letter-spacing: .05em; margin-bottom: 16px; }
  #setup a { color: #fff; }
  #setup input {
    width: 100%; background: #111; border: 1px solid #444; border-radius: 10px;
    color: #fff; font-size: 14px; padding: 13px 14px; outline: none;
    font-family: ui-monospace, Menlo, monospace;
  }
  #setup input:focus { border-color: #fff; }
  #setup .err { color: #ff7b7b; font-size: 12px; min-height: 18px; margin: 8px 0; letter-spacing: .05em; }
  #setup .save {
    width: 100%; background: #fff; color: #000; border: none; border-radius: 999px;
    font-size: 15px; letter-spacing: .3em; text-indent: .3em; padding: 13px 0; cursor: pointer;
  }
  #setup .close { display: inline-block; margin-top: 16px; color: #666; font-size: 13px; letter-spacing: .2em; cursor: pointer; }
</style>
</head>
<body>
  <div id="stars"></div>

  <div class="app">
    <div class="date"><span id="dateLabel"></span><span class="wd" id="wdLabel"></span></div>
    <div class="streak" id="streakLabel"></div>
    <div class="btn-wrap">
      <button id="checkBtn">打卡</button>
    </div>
    <div class="bottom">
      <div class="nav"><a href="calendar.html">日历 →</a></div>
      <div class="sync" id="syncLabel"></div>
    </div>
  </div>

  <div id="setup">
    <div class="card">
      <h2>连接 GitHub</h2>
      <p>粘贴一个 token，只需一次，存在这台手机里，不会写进网页和仓库。<br><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">去 GitHub 生成 token →</a><br>生成时只选 hamburgloveer.github.io 这个仓库，勾 Contents 读写。</p>
      <input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="err" id="setupErr"></div>
      <button class="save" id="tokenSave">保存</button>
      <div class="close" id="setupClose">以后再说</div>
    </div>
  </div>

<script>
  const KEY = 'dont-days';
  const OLD_KEY = 'daka-days';
  const TOKEN_KEY = 'dont-gh-token';
  // 同步方式：打卡记录存在仓库根目录的 data.json 里，直连 GitHub API。
  // token 不写进网页：由用户在设置里粘贴一次，只存在这台手机的浏览器里。
  // （token 写进公开网页会被 GitHub 自动吊销，所以不能嵌在代码里。）
  const REPO = 'hamburgloveer/hamburgloveer.github.io';
  const FILE_PATH = 'data.json';
  const BRANCH = 'main';
  const GH_API = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE_PATH;
  const getToken = () => { try { return (localStorage.getItem(TOKEN_KEY) || '').trim(); } catch (e) { return ''; } };
  const ghHeaders = () => ({ Authorization: 'Bearer ' + getToken(), Accept: 'application/vnd.github+json' });

  // 星空：细碎星点，少许微闪
  (function stars() {
    const layer = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('i');
      const size = Math.random() < 0.85 ? 1 : 2;
      const twinkle = Math.random() < 0.3;
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      if (twinkle) {
        s.style.animation = 'tw 3.5s ease-in-out infinite alternate';
        s.style.animationDelay = (Math.random() * 3).toFixed(1) + 's';
      } else {
        s.style.opacity = (0.25 + Math.random() * 0.6).toFixed(2);
      }
      layer.appendChild(s);
    }
  })();

  // 一次性迁移旧版记录
  try {
    if (!localStorage.getItem(KEY) && localStorage.getItem(OLD_KEY)) {
      localStorage.setItem(KEY, localStorage.getItem(OLD_KEY));
    }
  } catch (e) {}

  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const save = (s) => localStorage.setItem(KEY, JSON.stringify([...s]));
  let days = load();

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = new Date();
  const todayStr = fmt(today);
  const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  const btn = document.getElementById('checkBtn');
  const syncLabel = document.getElementById('syncLabel');
  document.getElementById('dateLabel').textContent =
    today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';
  document.getElementById('wdLabel').textContent = WEEKDAYS[today.getDay()];

  function setSync(t) { syncLabel.textContent = t; }

  function streak() {
    let n = 0;
    let d = new Date(today);
    if (!days.has(fmt(d))) d.setDate(d.getDate() - 1);
    while (days.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function render() {
    const done = days.has(todayStr);
    btn.innerHTML = done ? '<span class="tick">✓</span><span class="sub">再点一次取消</span>' : '打卡';
    btn.className = done ? 'done' : '';
    btn.id = 'checkBtn';
    const s = streak();
    document.getElementById('streakLabel').textContent = s >= 1 ? '连续打卡 ' + s + ' 天' : '';
  }

  // 音效：Web Audio 合成，不用音频文件
  let audioCtx = null;
  function tone(freq, delay, dur, vol) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    const t = audioCtx.currentTime + delay;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function playSound(checked) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (checked) { tone(660, 0, 0.18, 0.12); tone(990, 0.09, 0.3, 0.1); }
      else tone(330, 0, 0.15, 0.07);
    } catch (e) {}
  }
  // 触感：iOS 浏览器不开放震动接口，调用在 iPhone 上无效果，安卓可用
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // 读仓库里的 data.json；没有 token 或文件不存在返回空记录
  async function fetchRemote() {
    if (!getToken()) return { days: [], sha: null };
    const r = await fetch(GH_API + '?ref=' + BRANCH, { headers: ghHeaders() });
    if (r.status === 404) return { days: [], sha: null };
    if (!r.ok) throw new Error('read failed');
    const data = await r.json();
    let remote = [];
    try { remote = JSON.parse(atob(data.content.replace(/\n/g, ''))).days || []; } catch (e) {}
    return { days: remote, sha: data.sha };
  }

  // 把本机全量记录写回 data.json（覆盖式）；sha 冲突时重读一次再写
  async function pushRemote() {
    if (!getToken()) return;
    try {
      const cur = await fetchRemote();
      const payload = {
        message: 'update check-in data',
        content: btoa(JSON.stringify({ days: [...days] })),
        branch: BRANCH,
      };
      if (cur.sha) payload.sha = cur.sha;
      let r = await fetch(GH_API, {
        method: 'PUT',
        headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (r.status === 409) {
        const cur2 = await fetchRemote();
        if (cur2.sha) payload.sha = cur2.sha;
        r = await fetch(GH_API, {
          method: 'PUT',
          headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }
      if (r.ok) setSync('已同步 GitHub');
      else if (r.status === 401) { setSync('token 已失效 · 点此重设'); }
      else setSync('同步失败 · 仅本机');
    } catch (e) { setSync('同步失败 · 仅本机'); }
  }

  // 打开时合并：GitHub 上有的、本机没有的补进来；本机独有的再推上去
  async function syncFromRemote() {
    if (!getToken()) { setSync('未连接 GitHub · 点此设置'); return; }
    try {
      const remoteDays = (await fetchRemote()).days;
      const remote = new Set(remoteDays);
      let changed = false;
      remote.forEach((d) => { if (!days.has(d)) { days.add(d); changed = true; } });
      if (changed) { save(days); render(); }
      setSync('已同步 GitHub');
      // 本机有、GitHub 上没有的记录要推上去（比如第一次同步）
      const needsPush = [...days].some((d) => !remote.has(d));
      if (needsPush) await pushRemote();
    } catch (e) { setSync('同步失败 · 仅本机'); }
  }

  // 设置面板：粘贴 token，校验通过才保存
  const setupEl = document.getElementById('setup');
  const tokenInput = document.getElementById('tokenInput');
  const setupErr = document.getElementById('setupErr');
  function openSetup() { setupErr.textContent = ''; tokenInput.value = getToken(); setupEl.classList.add('open'); tokenInput.focus(); }
  function closeSetup() { setupEl.classList.remove('open'); }
  syncLabel.addEventListener('click', openSetup);
  document.getElementById('setupClose').addEventListener('click', closeSetup);
  document.getElementById('tokenSave').addEventListener('click', async () => {
    const t = tokenInput.value.trim();
    if (!t) { setupErr.textContent = '先粘贴 token'; return; }
    setupErr.textContent = '正在校验…';
    try {
      const r = await fetch(GH_API + '?ref=' + BRANCH, {
        headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' },
      });
      if (r.status === 401) { setupErr.textContent = 'token 不对，请检查'; return; }
      if (!r.ok && r.status !== 404) { setupErr.textContent = '连不上 GitHub，稍后再试'; return; }
      localStorage.setItem(TOKEN_KEY, t);
      closeSetup();
      setSync('同步中…');
      syncFromRemote();
    } catch (e) { setupErr.textContent = '连不上 GitHub，稍后再试'; }
  });

  btn.addEventListener('click', () => {
    const checked = !days.has(todayStr);
    if (checked) days.add(todayStr); else days.delete(todayStr);
    save(days);
    render();
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
    playSound(checked);
    buzz(checked ? 15 : 8);
    pushRemote();
  });

  render();
  syncFromRemote();
  if (location.hash === '#setup') openSetup();
</script>
</body>
</html>
