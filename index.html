<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打卡</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 48px) 24px calc(env(safe-area-inset-bottom) + 32px);
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .date {
    font-family: Georgia, "Songti SC", serif;
    font-size: 20px;
    letter-spacing: 0.12em;
    color: #999;
    margin-bottom: 64px;
  }
  #checkBtn {
    width: 208px;
    height: 208px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #000;
    color: #f5f5f5;
    font-size: 32px;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(255, 255, 255, 0.08);
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #checkBtn:active { transform: scale(0.96); }
  #checkBtn.done { background: #f5f5f5; color: #0a0a0a; border-color: #f5f5f5; }
  #checkBtn span { display: block; font-size: 13px; letter-spacing: 0.05em; margin-top: 8px; color: #888; }
  #checkBtn.done span { color: #555; }
  .nav { margin-top: 64px; }
  .nav a { color: #666; font-size: 14px; letter-spacing: 0.2em; text-decoration: none; }
</style>
</head>
<body>
  <div class="date" id="dateLabel"></div>
  <button id="checkBtn">打卡</button>
  <div class="nav"><a href="calendar.html">日历 →</a></div>

<script>
  const KEY = 'daka-days';
  // GitHub 同步中转地址：部署 Worker 后填入，例如 https://daka-sync.xxx.workers.dev
  // 为空时记录只存在本机浏览器里；填入后自动与仓库里的 data.json 同步。
  const WORKER_URL = "";
  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const save = (s) => localStorage.setItem(KEY, JSON.stringify([...s]));
  let days = load();

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = new Date();
  const todayStr = fmt(today);

  const btn = document.getElementById('checkBtn');
  document.getElementById('dateLabel').textContent =
    today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';

  function render() {
    const done = days.has(todayStr);
    btn.innerHTML = done ? '✓<span>再点一次取消</span>' : '打卡';
    btn.className = done ? 'done' : '';
  }

  async function pushRemote() {
    if (!WORKER_URL) return;
    try {
      await fetch(WORKER_URL + '/api/days', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days: [...days] })
      });
    } catch (e) {}
  }

  async function syncFromRemote() {
    if (!WORKER_URL) return;
    try {
      const r = await fetch(WORKER_URL + '/api/days');
      if (!r.ok) return;
      const data = await r.json();
      const remote = new Set(Array.isArray(data.days) ? data.days : []);
      let changed = false;
      remote.forEach((d) => { if (!days.has(d)) { days.add(d); changed = true; } });
      if (changed) { save(days); render(); }
      await pushRemote();
    } catch (e) {}
  }

  btn.addEventListener('click', () => {
    if (days.has(todayStr)) days.delete(todayStr); else days.add(todayStr);
    save(days);
    render();
    pushRemote();
  });

  render();
  syncFromRemote();
</script>
</body>
</html>
