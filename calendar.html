<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DONT · 日历</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DONT">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: #fff;
    color: #000;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100dvh;
  }

  /* 固定一屏，不可上下滑动 */
  .app {
    height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .back { align-self: flex-start; }
  .back a { color: #000; font-size: 14px; letter-spacing: .2em; text-decoration: none; }
  .stats { display: flex; justify-content: center; gap: 64px; margin: 18px 0 14px; }
  .stat { text-align: center; }
  .stat .num { font-family: Georgia, "Songti SC", serif; font-size: 46px; font-weight: 600; line-height: 1.1; }
  .stat .label { color: #999; font-size: 13px; margin-top: 4px; letter-spacing: .15em; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-head .month { font-family: Georgia, "Songti SC", serif; font-size: 20px; letter-spacing: .08em; }
  .cal-head button {
    background: none; border: 1.5px solid #000; color: #000;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 17px; line-height: 1;
  }
  .cal-grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto; grid-auto-rows: 1fr;
    text-align: center;
  }
  .cal-grid .wd { color: #999; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .cal-grid .day { display: flex; align-items: center; justify-content: center; min-height: 0; }
  .cal-grid .dot {
    width: min(10vw, 40px); aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #000;
  }
  .cal-grid .day.future .dot { color: #ccc; }
  .cal-grid .day.today .dot { box-shadow: inset 0 0 0 1.5px #000; }
  .cal-grid .day.checked .dot { background: #000; color: #fff; font-weight: 600; }
  .cal-grid .day.empty .dot { visibility: hidden; }
  .month-count { text-align: center; color: #999; font-size: 13px; letter-spacing: .1em; margin-top: 10px; }
</style>
</head>
<body>
  <div class="app">
    <div class="back"><a href="index.html">← 打卡</a></div>

    <div class="stats">
      <div class="stat"><div class="num" id="totalNum">0</div><div class="label">累计天数</div></div>
      <div class="stat"><div class="num" id="streakNum">0</div><div class="label">连续打卡</div></div>
    </div>

    <div class="cal-head">
      <button id="prevMonth" aria-label="上个月">‹</button>
      <div class="month" id="monthLabel"></div>
      <button id="nextMonth" aria-label="下个月">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="month-count" id="monthCount"></p>
  </div>

<script>
  const KEY = 'dont-days';
  const OLD_KEY = 'daka-days';
  // 与首页保持一致：直连 GitHub 读仓库里的 data.json。
  // token 写在公开网页里，看源码就能拿到；只限这一个仓库的 Contents 读写，用户已确认接受。
  const REPO = 'hamburgloveer/hamburgloveer.github.io';
  const FILE_PATH = 'data.json';
  const BRANCH = 'main';
  const GITHUB_TOKEN = "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";
  const GH_API = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE_PATH;
  const ghHeaders = {
    Authorization: 'Bearer ' + GITHUB_TOKEN,
    Accept: 'application/vnd.github+json',
  };
  async function fetchRemote() {
    const r = await fetch(GH_API + '?ref=' + BRANCH, { headers: ghHeaders });
    if (r.status === 404) return { days: [], sha: null };
    if (!r.ok) throw new Error('read failed');
    const data = await r.json();
    let remote = [];
    try { remote = JSON.parse(atob(data.content.replace(/\n/g, ''))).days || []; } catch (e) {}
    return { days: remote, sha: data.sha };
  }

  try {
    if (!localStorage.getItem(KEY) && localStorage.getItem(OLD_KEY)) {
      localStorage.setItem(KEY, localStorage.getItem(OLD_KEY));
    }
  } catch (e) {}

  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const save = (s) => localStorage.setItem(KEY, JSON.stringify([...s]));
  let days = load();

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = new Date();
  const todayStr = fmt(today);

  function streak() {
    let n = 0;
    let d = new Date(today);
    if (!days.has(fmt(d))) d.setDate(d.getDate() - 1);
    while (days.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  let viewY = today.getFullYear(), viewM = today.getMonth();
  function renderCal() {
    const first = new Date(viewY, viewM, 1);
    const offset = (first.getDay() + 6) % 7; // 周一开头
    const dim = new Date(viewY, viewM + 1, 0).getDate();
    document.getElementById('monthLabel').textContent = viewY + '年' + (viewM + 1) + '月';
    let count = 0;
    let html = ['一','二','三','四','五','六','日'].map(w => '<div class="wd">' + w + '</div>').join('');
    for (let i = 0; i < offset; i++) html += '<div class="day empty"><div class="dot"></div></div>';
    for (let d = 1; d <= dim; d++) {
      const s = viewY + '-' + pad(viewM + 1) + '-' + pad(d);
      const cls = ['day'];
      if (days.has(s)) { cls.push('checked'); count++; }
      if (s === todayStr) cls.push('today');
      if (s > todayStr) cls.push('future');
      html += '<div class="' + cls.join(' ') + '"><div class="dot">' + d + '</div></div>';
    }
    document.getElementById('calGrid').innerHTML = html;
    document.getElementById('monthCount').textContent = '本月已打卡 ' + count + ' 天';
  }

  function render() {
    document.getElementById('totalNum').textContent = days.size;
    document.getElementById('streakNum').textContent = streak();
    renderCal();
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCal();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCal();
  });

  render();
  (async () => {
    try {
      const remote = new Set((await fetchRemote()).days);
      let changed = false;
      remote.forEach((d) => { if (!days.has(d)) { days.add(d); changed = true; } });
      if (changed) { save(days); render(); }
    } catch (e) {}
  })();
</script>
</body>
</html>
